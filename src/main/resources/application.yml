spring:
  application:
    name: patrol_be

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 150MB
      file-size-threshold: 2MB

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  datasource:
    url: jdbc:sqlserver://192.168.122.2:1433;databaseName=F2Database;encrypt=false;trustServerCertificate=true
    username: kproduct
    password: Tanphat@02032013
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000

server:
  address: 0.0.0.0
  port: 9299
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 1000
    max-http-form-post-size: 150MB
    max-swallow-size: -1
    connection-timeout: 300000

speech:
  stt-url: http://192.168.122.16:7011
  transcribe:
    enabled: false

# Fixed Asset machine scope: F2_FIXED_ASSET Div = div OR Factory = factory (compared trimmed).
# MAP (F2_FIXED_ASSET_MAP) rows of div are used for every machine in scope.
fixed-asset:
  div: KVH
  factory: Factory 2
  # Folder for Fixed Asset photos (Photo3 file names in F2_FIXED_ASSET point here),
  # served at /images/FixedAsset/**. No shared upload root key exists (Patrol / MA use
  # <user.dir>/uploaded_images in code), so this is the full path.
  photo-dir: "D:/Viet/BE/patrol_be/uploaded_images/FixedAsset"